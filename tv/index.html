<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AgRoss TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  video { width: 100vw; height: 100vh; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="v" src="video.mp4" loop autoplay muted playsinline></video>
<script>
  var v = document.getElementById('v');
  v.play();
  // clique/toque em qualquer lugar entra em tela cheia (navegador exige gesto do usuario)
  document.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });
  // failsafe: se travar, recarrega a pagina
  setInterval(function () { if (v.paused) location.reload(); }, 30000);
</script>
</body>
</html>
